<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#1b1430;
    font-family:'Press Start 2P', monospace;
    display:flex;align-items:center;justify-content:center;min-height:100vh;
  }
  #frame{position:relative;padding:12px;background:#2a1f14;
    border:3px solid #6d4a2c;border-radius:10px;
    box-shadow:0 0 60px rgba(255,194,71,.10), inset 0 0 30px rgba(0,0,0,.55);}
  canvas{display:block;width:900px;height:560px;border-radius:4px;cursor:default;}
  #crt{pointer-events:none;position:absolute;inset:12px;border-radius:4px;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.08) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.28) 100%);
    mix-blend-mode:multiply;}
</style>
</head>
<body>
<div style="position:absolute;left:-9999px;top:0;font-family:'Barlow Semi Condensed',sans-serif">.<span style="font-family:'Press Start 2P',monospace">.</span></div>
<div id="frame">
  <canvas id="cv" width="900" height="560"></canvas>
  <div id="crt"></div>
</div>
<script>
"use strict";
const cv = document.getElementById('cv');
const cx = cv.getContext('2d');
const W = 900, H = 560; // market v12: logical size. Every coordinate in the game is in these units
let DPR=0;
function fitCanvas(){ // market v12: back the canvas with the screen's real pixels so text and shapes stay sharp on scaled displays
  const d=(typeof window!=='undefined'&&window.devicePixelRatio)||1;
  if(d===DPR)return;
  DPR=d;cv.width=Math.round(W*d);cv.height=Math.round(H*d);
  cv.style.width=W+'px';cv.style.height=H+'px';
  cx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
}
fitCanvas();
const FONT = "'Press Start 2P', monospace";

// ---------- palette ----------
const C = {
  night:'#1b1430', plum:'#2b2140',
  woodD:'#4a3018', wood:'#6d4a2c', woodL:'#8f6a3f', woodXL:'#a97b3f',
  parch:'#f4e3b8', parchDim:'#c9b48a', parchXD:'#8f7a58', ink:'#3a2412',
  gold:'#ffc247', goldD:'#c78d1e',
  green:'#6fcf59', greenD:'#3f7d32', meadow:'#77b255', meadowD:'#5c9142', meadowXD:'#47773a',
  sky:'#8fd3f0', skyD:'#5aa8d6', sun:'#ffe08a',
  river:'#2f86d6', riverD:'#1b5fa8', foam:'#bfe6ff',
  rock:'#8b8f98', rockD:'#5c6068',
  red:'#ff6b5e', redD:'#b23a30',
  tan:'#c9a06a', deer:'#9c6b30', buff:'#5b3d1e', bear:'#6e4318', bearD:'#4c2d0e',
  canopy:'#4c9440', canopyD:'#39702f', trunk:'#5d3d1c',
};

// ---------- utils ----------
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const FONT2="'Barlow Semi Condensed', sans-serif";
const UIFONT="'Inter', system-ui, sans-serif"; // bear v4: clean modern sans for the ready pane
function uitxt(s,x,y,size,color,align,weight){
  cx.font=(weight?weight+' ':'')+(size*2)+"px "+UIFONT;
  cx.fillStyle=color||C.parch;cx.textAlign=align||'left';cx.textBaseline='top';
  cx.fillText(s,x,y-Math.round(size*0.3));
}
function centeruitxt(s,y,size,color,weight){ uitxt(s,W/2,y,size,color,'center',weight); }
// ptxt: retro pixel face (Press Start 2P) -- big titles only
function ptxt(s,x,y,size,color,align){
  cx.font=size+"px "+FONT; cx.fillStyle=color||C.parch;

function audioCtx(){
  if(AC)return AC;
  try{const A=(typeof window!=='undefined')&&(window.AudioContext||window.webkitAudioContext);if(A)AC=new A();}catch(e){}

function beep(f0,dur,type,vol,f1,delay){
  const a=audioCtx();if(!a||!sfxOn)return;
  try{
    const t=a.currentTime+(delay||0);
    const o=a.createOscillator(),g=a.createGain();
    o.type=type||'square';
    o.frequency.setValueAtTime(f0,t);
    if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
    g.gain.setValueAtTime(vol||0.15,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g);g.connect(a.destination);
    o.start(t);o.stop(t+dur+0.02);
  }catch(e){}
}
function hiss(dur,vol,delay,cutoff){
  const a=audioCtx();if(!a||!sfxOn)return;
  try{
    const t=a.currentTime+(delay||0);
    const n=Math.floor(a.sampleRate*dur);
    const buf=a.createBuffer(1,n,a.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    const src=a.createBufferSource();src.buffer=buf;
    const g=a.createGain();
    g.gain.setValueAtTime(vol||0.2,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    const fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(cutoff||3000,t);
    src.connect(fl);fl.connect(g);g.connect(a.destination);
    src.start(t);
  }catch(e){}
}

function localStore(){ // v29 (16): downloaded and published copies save to localStorage, wrapped in the same async get/set/delete shape
  try{

    return {

      set:async(k,v)=>{ls.setItem(k,String(v));return {key:k,value:String(v)};},
      delete:async k=>{ls.removeItem(k);return {key:k,deleted:true};}};
  }catch(e){return null;} // no storage at all: the game runs as before, without saving
}

async function loadMeta(){
  if(!store)return;
  try{
    const r=await store.get('oregano_trail_1_save');
    if(r&&r.value){
      const p=JSON.parse(r.value);
      if(p&&p.G&&p.v>=3&&p.v<=12&&Array.isArray(p.G.crates)&&Number.isFinite(p.G.money)&&Number.isFinite(p.G.day)){ // review 2a: a save missing its basic fields is retired, not loaded
        if(p.v===3){p.G.shockLog=[];p.G.rumorMsg='';p.G.tipUsed=false;p.G.gossipUsed=false;p.v=4;}
        if(p.v===4){p.G.insured=false;p.G.scoredLap=false;p.v=5;}
        if(p.v===5){ // 3b-2: contracts replace shocks+rumors. drop the dead fields, add contract state (offers repopulate on next arrival)
          p.G.contracts=[];p.G.offers=[];p.G.contractReports=[];
          delete p.G.shockLog;delete p.G.rumorMsg;delete p.G.tipUsed;delete p.G.gossipUsed;p.v=6;}
        if(p.v===6){ // v12: contract bonds. in-flight contracts posted no bond; offers get a computed bond
          (p.G.contracts||[]).forEach(c=>{if(c.bond==null)c.bond=0;});
          (p.G.offers||[]).forEach(o=>{if(o.bond==null)o.bond=Math.round((o.reward||0)*0.25);});
          p.v=7;}
        if(p.v===7){p.G.bearPending=false;p.v=8;} // v13: transient bear-leg routing flag; safe default
        if(p.v===8){p.G.townGold=null;p.v=9;} // v15: town gold; null = roll fresh for the current town on next town screen
        if(p.v===9){p.G.stock=null;p.v=10;} // market v1: town stock; null = set for the current town on next town screen
        if(p.v===10){ // v20: freshness in trips. Saves are taken in town, so count the trips already made (5 days each) off the new life
          const OLD={turnips:8,apples:10,pork:22,meat:6};
          (p.G.crates||[]).forEach(c=>{if(c.fresh!=null&&OLD[c.good])c.fresh=Math.max(0,GOODS[c.good].spoil-Math.round((OLD[c.good]-c.fresh)/5));});
          p.G.lap=0;p.v=11;}
        if(p.v===11){p.v=12;} // v22: a run saved on the St. Louis leg has townIdx -1 and resumes at the leg's start. Nothing to convert; the bump retires v22 saves in older builds
        savedRun=p;
      }
      else{savedRun=null;if(p)staleSave=true;try{store.delete('oregano_trail_1_save').catch(()=>{});}catch(e2){}}
    }
  }catch(e){savedRun=null;}
  try{const r=await store.get('oregano_trail_1_scores');if(r&&r.value)highScores=validScores(JSON.parse(r.value));}catch(e){highScores=[];} // review 2a: only well-formed best runs
  try{const r=await store.get('oregano_trail_1_settings');if(r&&r.value){const p=JSON.parse(r.value);if(p){if(typeof p.sfx==='boolean')sfxOn=p.sfx;if(p.river==='still'||p.river==='scroll')RIVER_MODE=p.river;if(typeof p.popup==='boolean')riverPopupSeen=p.popup;}}}catch(e){} // v26b: Master mode removed; an old saved master setting is ignored
}

  return TOWNS.map(t=>{

function price(tIdx,g,kind){

// ---------- delivery contracts (Phase 3b-2) ----------
// A rolling board, refreshed on each town arrival. Each offer: deliver N crates of a
// randomized good to the NEXT town for $R, locked at accept. v13: $R/crate = the good's
// OWN price at the destination x CONTRACT_MARKUP. (Was pegged to the town's PRICIEST good,
// which made cheap-good contracts pay oregano money regardless -- the dominance bug.)
function rollOffers(){
  G.offers=[];
  if(G.townIdx>=TOWNS.length-1)return; // Willamette: journey's end, no next town to contract for
  const dest=G.townIdx+1;
  const pool=GOOD_KEYS.slice();
  for(let i=pool.length-1;i>0;i--){const j=ri(0,i);const tmp=pool[i];pool[i]=pool[j];pool[j]=tmp;} // shuffle for distinct goods
  for(let i=0;i<3;i++){
    const g=pool[i%pool.length],n=ri(2,4);
    const perCrate=Math.round(G.prices[dest][g]*CONTRACT_MARKUP); // v13: peg to THIS good's own price at dest, not the town's priciest good
    const reward=perCrate*n;
    G.offers.push({good:g,n,dest,reward,bond:Math.round(reward*0.25)});
  }
}
function acceptOffer(oi){
  const o=G.offers[oi];if(!o)return;
  if(G.money<(o.bond||0))return; // must post the bond to take the order
  G.money-=(o.bond||0);
  G.contracts.push({good:o.good,n:o.n,dest:o.dest,reward:o.reward,bond:o.bond||0});
  G.offers.splice(oi,1);
  SFX.buy();saveRun();
}
function returnContract(ci){ // market v10: hand a held contract back before departure. Full bond refund; the same offer goes back on the board
  const c=G.contracts[ci];if(!c||c.dest<=G.townIdx)return; // held only: due-here contracts can't be returned, and nothing can be after departure
  G.money+=(c.bond||0);
  G.contracts.splice(ci,1);
  G.offers.push({good:c.good,n:c.n,dest:c.dest,reward:c.reward,bond:c.bond||0});
  saveRun(); // the button press already clicks
}
function deliverContract(ci){
  const c=G.contracts[ci];if(!c||crateCount(c.good)<c.n)return;
  for(let k=0;k<c.n;k++){ // consume most-spoiled crates first, same as selling
    let best=-1,bestF=Infinity;
    G.crates.forEach((cr,idx)=>{if(cr.good===c.good){const f=cr.fresh==null?1e9:cr.fresh;if(f<bestF){bestF=f;best=idx;}}});
    if(best>=0)removeCrateAt(best);
  }
  G.money+=c.reward+(c.bond||0); // reward paid, posted bond returned
  G.contractReports.push({kind:'deliver',msg:'DELIVERED '+c.n+' '+GOODS[c.good].name+'  +$'+c.reward});
  G.contracts.splice(ci,1);
  if(state==='town')toBuyIfDone(G.townIdx); // final (20)
  SFX.droveOff();saveRun();
}
function lapseShort(){ // v21: a contract short of crates on arrival can never be met here (the good is LOCKED and game is never sold), so it lapses at once: bond lost, lock lifted
  const t=G.townIdx,reports=G.contractReports||[];
  G.contracts.slice().forEach(c=>{
    if(c.dest!==t)return;
    const have=crateCount(c.good);if(have>=c.n)return;
    const sh=c.n-have;reports.push({kind:'lapse',msg:'CONTRACT LAPSED: SHORT '+sh+(sh===1?' CRATE OF ':' CRATES OF ')+GOODS[c.good].name+(c.bond?' \u00b7 BOND $'+c.bond+' LOST':'')}); // v25: reads right for any count and good (user)
    G.contracts.splice(G.contracts.indexOf(c),1);
  });
  G.contractReports=reports;
}
function departContracts(){ // called on DEPART: due-but-undelivered contracts lapse; clears this town's delivery reports
  const reports=[];
  for(let i=G.contracts.length-1;i>=0;i--){
    if(G.contracts[i].dest===G.townIdx){
      const c=G.contracts[i];
      reports.push({kind:'lapse',msg:'CONTRACT LAPSED \u2014 '+c.n+' '+GOODS[c.good].name+(c.bond?' \u00b7 BOND $'+c.bond+' LOST':' NOT DELIVERED')});
      G.contracts.splice(i,1);
    }
  }
  G.contractReports=reports; // lapses carry to the next town's band; old delivery reports drop here
}

const TOWN_GOLD_BASE=400; // v15: each town's market holds finite gold (Skyrim-vendor style)
function townGoldMul(t){ // v15: rich towns hold more -- average of the town's existing price quirks (missing quirk = 1)
  return GOOD_KEYS.reduce((s,g)=>s+(TOWNS[t].mul[g]||1),0)/GOOD_KEYS.length;
}
function rollTownGold(){ // v15: rolled on each arrival, +/-25%. Contracts due here claim their reward FIRST (set aside), so only the rest can buy your goods
  const t=G.townIdx;
  const owed=G.contracts.filter(c=>c.dest===t).reduce((s,c)=>s+c.reward,0);
  return Math.max(0,Math.round(TOWN_GOLD_BASE*townGoldMul(t)*rnd(0.75,1.25))-owed);
}
const STOCK_BASE=4,STOCK_MAX=6; // market v1: crates of each buyable good a town has for sale
function stockFor(t){ // market v1: cheap-here goods are plentiful, pricey-here goods are scarce. Fixed per town, reset on every arrival. Selling does NOT add stock
  const o={};
  GOOD_KEYS.forEach(g=>{if(GOODS[g].buyable)o[g]=clamp(Math.round(STOCK_BASE/(TOWNS[t].mul[g]||1)),1,STOCK_MAX);});
  return o;
}

function addCrate(good,lbs,basis){
  if(G.crates.length>=crateCap())return false;
  const sp=GOODS[good].spoil; // v20: fresh = trips the crate can still finish. Game is bagged mid-trip, so that trip is free: it still lasts 1 trip from the town where it lands
  G.crates.push({id:crateId(),good,lbs:lbs||GOODS[good].lbs,fresh:sp==null?null:sp+(good==='meat'?1:0),lashed:false,basis:basis||0});
  return true;

function wearRopes(){G.crates.forEach(c=>{if(c.lashed&&Math.random()<ROPE.wear)c.worn=true;});}
function removeCrateAt(idx){ // rope rule B: a lashed crate lost mid-trail (spoil/bear/toss) takes its rope with it

}
function eatLooseCrate(){ // bear v5: bear reaches the cart, takes ONE random loose crate -> center banner (not floating text)
  const loose=[];G.crates.forEach((c,i)=>{if(!c.lashed)loose.push(i);});
  if(loose.length){
    const idx=loose[ri(0,loose.length-1)],g=G.crates[idx].good;
    removeCrateAt(idx);
    BE.result='THE BEAR ATE A CRATE OF '+GOODS[g].name+'!';SFX.chomp();
    return g;
  }
  BE.result=G.crates.length?'THE BEAR GOT NOTHING. YOUR CARGO WAS LASHED TIGHT!':'THE BEAR FOUND AN EMPTY CART.';
  return null;
}
function lapReset(){ // ANOTHER RUN: keep the purse & gear, reroll the world, back to St. Louis (v22; no opener)
  G.crates=G.crates.filter(c=>carries(c.good)); // v24: only oregano comes along (user). Filtered before the lap counts up, so the season just finished decides
  G.lap=(G.lap||0)+1; // v20: lap counter. v27b: it only counts runs; nothing in play changes between them (user)
  G.crates.forEach(c=>{c.lashed=false;delete c.worn;delete c.from;});
  G.townIdx=-1;G.prices=rollPrices(); // v22: the St. Louis leg at the next lap's difficulty
  G.contracts=[];G.offers=[];G.contractReports=[];

  G.insured=false;G.scoredLap=false;G.causeOfDeath='';

  G.townGold=null;G.stock=null; // v22: rolled for Independence on arrival
  setState('travel');
}

  if(s==='town'&&prev!=='settings'){resetOrder();MODE=(G&&G.crates&&G.crates.length)?'sell':'buy';if(G)toBuyIfDone(G.townIdx);MKH=0;} // final (20): owed crates alone open on BUY // v30 (7): the BUY/SELL hint throbs twice as each town's market opens // market v3: a fresh town screen starts with an empty order. market v15: on SELL when carrying any crate (selling first funds the buys), BUY when the raft is empty
  NOTE=null; // market v11: the cost note never survives a screen change

  if(s==='gameover'){SFX.dirge();markDeath();} // v26b: Master mode removed, so every sinking keeps its checkpoint
  if(s==='finale'){SFX.fanfare();if(!G.scoredLap){G.scoredLap=true;recordScore();}saveRun();}

function wrapTxt(s,x,y,size,col,maxW,lh){ // market v6: optional line height (default unchanged)

  });

function nextTip(){
  if(!Array.isArray(G.tipBag)||!G.tipBag.length){ // refill; older saves have no bag yet
    const b=TIPS.map((_,i)=>i);
    for(let i=b.length-1;i>0;i--){const j=ri(0,i);const x=b[i];b[i]=b[j];b[j]=x;}
    if(b.length>1&&b[0]===G.lastTip){const x=b[0];b[0]=b[1];b[1]=x;} // no back-to-back repeat across a refill
    G.tipBag=b;
  }
  const k=G.tipBag.shift();G.lastTip=k;return TIPS[k];
}
const TIPBOX={y:116,w:640,lh:22,size:9,maxLines:3};
function tipLines(s){ // wrap with the bold face actually drawn
  cx.font='700 '+(TIPBOX.size*2)+'px '+FONT2;
  const words=s.split(' '),lines=[];let line='';
  words.forEach(w=>{const t=line?line+' '+w:w;if(line&&cx.measureText(t).width>TIPBOX.w-40){lines.push(line);line=w;}else line=t;});
  if(line)lines.push(line);
  return lines;
}
function drawTip(){ // bold, on a dark plate directly below the progress bar so clouds and sky never wash it out
  if(!TR.tip)return TIPBOX.y;
  const L=TR.tipLines,h=16+L.length*TIPBOX.lh,x=W/2-TIPBOX.w/2; // market v14: header removed (some tips are market tips), plate tightened to the text
  cx.fillStyle='rgba(42,31,20,0.86)';cx.fillRect(x,TIPBOX.y,TIPBOX.w,h);
  cx.fillStyle=C.gold;cx.fillRect(x,TIPBOX.y,TIPBOX.w,3);
  L.forEach((l,i)=>{cx.font='700 '+(TIPBOX.size*2)+'px '+FONT2;cx.fillStyle=C.parch;cx.textAlign='center';cx.textBaseline='top';
    cx.fillText(l,W/2,TIPBOX.y+14+i*TIPBOX.lh-Math.round(TIPBOX.size*0.3));});
  return TIPBOX.y+h;
}

function spoilTick(){ // v20: once per trip, early on the trail: a crate with no trips left rots. Arrival counts the trip off (arriveTown)
  const rotted=[];

}

function updHunt(dt){
  HU.t+=dt;
  const timeLeft=Math.max(0,HU.dur-HU.t);
  if(HU.recoil>0)HU.recoil-=dt*6;

  const WX=100,WY=H-84; // v22: was 86; the mirrored ox now leads to the left and would touch the screen edge

  // animals
  HU.animals.forEach(an=>{
    if(an.dead){an.deadT+=dt;return;}
    const a=ANIMALS[an.type];
    if(!HU.spooked){
      an.retarget-=dt;
      if(an.retarget<=0){an.retarget=rnd(1,2.6);
        const ang=rnd(0,Math.PI*2);
        an.vx=Math.cos(ang)*a.amble;an.vy=Math.sin(ang)*a.amble*0.6;}
      an.x+=an.vx*dt;an.y+=an.vy*dt;
      an.x=clamp(an.x,80,W-80);an.y=clamp(an.y,120,H-100);
    } else {
      an.x+=an.vx*dt;an.y+=an.vy*dt;
      if(an.x<-120||an.x>W+120)an.fled=true;
    }
  });
  HU.animals=HU.animals.filter(an=>!(an.dead&&an.deadT>0.7)&&!an.fled);

  // shooting
  if(mouse.clicked&&G.ammo>0&&!HU.done){
    G.ammo--;HU.shots++;HU.recoil=1;SFX.shot();
    spookHerd();
    if(inTree(mouse.x,mouse.y)){
      HU.flashes.push({x:mouse.x,y:mouse.y,t:0,txt:'THUNK',col:C.parchDim});SFX.thunk();
    } else {
      let hit=null;
      for(const an of HU.animals){
        if(an.dead)continue;
        const a=ANIMALS[an.type];
        if(Math.abs(mouse.x-an.x)<a.w/2+8&&Math.abs(mouse.y-an.y)<a.h/2+10){hit=an;break;}
      }
      if(hit){
        hit.hp--;
        if(hit.hp<=0){hit.dead=true;HU.hits++;HU.meat+=ANIMALS[hit.type].meat;SFX.bag();
          HU.flashes.push({x:hit.x,y:hit.y-24,t:0,txt:'+'+crateWord(ANIMALS[hit.type].meat/30),col:C.gold});}
        else{HU.flashes.push({x:hit.x,y:hit.y-24,t:0,txt:'TOUGH!',col:C.red});SFX.tough();}
      } else {
        HU.flashes.push({x:mouse.x,y:mouse.y,t:0,txt:'MISS',col:C.parchDim});SFX.miss();
      }
    }
  }
  HU.flashes.forEach(f=>f.t+=dt);
  HU.flashes=HU.flashes.filter(f=>f.t<1.1);

  // end conditions
  const liveAnimals=HU.animals.filter(an=>!an.dead).length;
  if(!HU.done&&(timeLeft<=0||(liveAnimals===0&&HU.t>2)||(G.ammo===0&&HU.t>1.5))){ // market v7: E-to-pack-up removed
    HU.done=true;
  }
  if(HU.done){
    HU.doneT+=dt;
    if(HU.doneT>1){
      // convert meat to crates (hunted game costs nothing: basis $0)
      let left=0,m=HU.meat;
      while(m>0){
        const lbs=Math.min(30,m);
        if(!addCrate('meat',lbs,0)){left=m;break;}
        m-=lbs;
      }
      G.waitLbs=left;
      G.huntStats={meat:HU.meat,shots:HU.shots,hits:HU.hits,left};
      setState(firstLeg()?'bearEvent':'lash'); // v10: hunt/bear XOR -- a hunt leg never stacks a bear. v22: except the St. Louis leg, where the bear comes before the lash (user)
      return;
    }
  }

  // ---- draw ----
  cx.fillStyle=C.meadow;cx.fillRect(0,0,W,H);
  cx.fillStyle=C.meadowXD;
  for(let i=0;i<70;i++)cx.fillRect((i*151)%W,110+((i*89)%(H-160)),3,8);
  cx.fillStyle=C.meadowD;
  for(let i=0;i<8;i++){cx.beginPath();cx.ellipse((i*141)%W,140+((i*211)%(H-220)),30,10,0,0,7);cx.fill();}
  // parked wagon (bear target)
  drawWagonSide(WX,WY,2.2,0);
  txt('YOUR CART',WX,WY+22,7,C.ink,'center');

  HU.animals.forEach(drawAnimal);
  HU.trees.forEach(drawTree);
  HU.flashes.forEach(f=>{
    txt(f.txt,f.x,f.y-30-f.t*26,f.big?14:9,f.col,'center');
  });

  // crosshair
  const r=13+HU.recoil*8;
  cx.strokeStyle=G.ammo>0?C.gold:C.red;cx.lineWidth=2;
  cx.beginPath();cx.arc(mouse.x,mouse.y,r,0,7);cx.stroke();
  cx.beginPath();
  cx.moveTo(mouse.x-r-6,mouse.y);cx.lineTo(mouse.x-r+4,mouse.y);
  cx.moveTo(mouse.x+r-4,mouse.y);cx.lineTo(mouse.x+r+6,mouse.y);
  cx.moveTo(mouse.x,mouse.y-r-6);cx.lineTo(mouse.x,mouse.y-r+4);
  cx.moveTo(mouse.x,mouse.y+r-4);cx.lineTo(mouse.x,mouse.y+r+6);
  cx.stroke();

  drawHUD();
  txt2('GAME BAGGED: '+crateWord(HU.meat/30),W-16,H-30,9,C.gold,'right'); // v20: crates. final (17): bottom right, out of the herd's way (user)
  txt2(Math.ceil(timeLeft)+'s',W-16,56,12,timeLeft<=6?C.red:C.parch,'right');
  if(!HU.spooked){const L='THE HERD HASN\'T NOTICED YOU. FIRST SHOT COUNTS.';cx.font='18px '+FONT2;const bw=Math.ceil(cx.measureText(L).width)+48,bx=W/2-bw/2,by=48,bh=34; // final (17): a banner under the top bar until the first shot (user; was 4 seconds of plain text)
    cx.fillStyle='rgba(42,31,20,0.82)';cx.fillRect(bx,by,bw,bh);cx.strokeStyle=C.gold;cx.lineWidth=2;cx.strokeRect(bx,by,bw,bh);centerTxt(L,by+12,9,C.gold);}
  if(G.ammo===0)centerTxt('OUT OF AMMO',80,10,C.red);
  if(HU.done)centerTxt('PACKING UP...',H/2-10,12,C.ink);
}

// ---------- river ----------
let RV;
function initScroll(){ // v28: SCROLL VIEW, the v27b river
  const r=riverFor(G.townIdx);
  RV={mode:'scroll',hint:true,cfg:r,speed:r.speed,t:0,x:W/2,vx:0,rocks:[],logs:[],rockT:0.4,logT:2, // river v1: foam dots removed
      lane:[{t:0,x:W/2}],laneTgt:W/2,
      hitFlash:0,invuln:0,currents:[],curT:3,bankL:150,bankR:W-150,done:false,
      white:[],whiteT:0.5, // market v7: decoration only, never checked for collisions
      allLashed:G.crates.length>0&&G.crates.every(c=>c.lashed),spillMsg:null,spillT:0};
  // v27: the river starts as if it had been flowing for RIVER_HEAD seconds, so rocks, logs, currents and white water are already
  // on the water when the raft appears (user, river_demo_v3). The river's own update runs the head start with the raft held at
  // center, out of play, and nothing drawn. At 50 a hazard takes 10 seconds to reach the raft, so the first arrives about 2 seconds in.
  // The safe lane still starts at the raft's center at t 0. Length, rates and finish are unchanged.
  RV.pre=true;RV.t=-RIVER_HEAD;RV.invuln=1e9;
  while(RV.t<-1e-9)updRiver(Math.min(1/60,-RV.t));
  RV.pre=false;RV.t=0;RV.invuln=0;RV.hitFlash=0;RV.x=W/2;RV.vx=0;
}
const RIVER_HEAD=8; // v27 (user)
// river v1: fairness rule. An invisible safe lane wanders down the river slower than the heaviest raft can steer.
// A rock or log is never placed where it would cross the lane at the raft line, so a clean run always exists.
const LANE={v:24,margin:12,edge:60,step:0.25,tries:8,retry:0.2};
function laneExtend(tEnd){
  const A=RV.lane;
  while(A[A.length-1].t<tEnd){
    const L=A[A.length-1];
    if(Math.abs(RV.laneTgt-L.x)<1)RV.laneTgt=rnd(RV.bankL+LANE.edge,RV.bankR-LANE.edge);
    A.push({t:L.t+LANE.step,x:L.x+clamp(RV.laneTgt-L.x,-LANE.v*LANE.step,LANE.v*LANE.step)});
  }
  while(A.length>2&&A[1].t<RV.t-2)A.shift();
}
function laneX(t){ // lane x when the river slice at time t passes the raft line
  const A=RV.lane;if(t<=A[0].t)return A[0].x;
  const i=Math.min(A.length-2,Math.floor((t-A[0].t)/LANE.step));
  return A[i].x+(A[i+1].x-A[i].x)*clamp((t-A[i].t)/LANE.step,0,1);
}
function rockClear(o){ // a rock at y reaches the raft line (460) after (460-y)/speed seconds
  const f=RV.speed,tc=RV.t+(460-o.y)/f,half=(o.s*0.7+22)/f,need=o.s*0.7+18+LANE.margin;
  laneExtend(tc+half+0.5);
  for(let k=-2;k<=2;k++)if(Math.abs(o.x-laneX(tc+half*k/2))<need)return false;
  return true;
}
const LOG_SPD=[25,62.5]; // v27: was 40 to 100; 5/8, the same ratio as the flow, so logs still reach the raft (user, river_demo_v4). river v9: was a fixed 70 for every log, so at 100 every log reached the raft row mid-river
function logClear(o){ // logs drift down at 0.9 of the flow and across at their own speed
  const vy=RV.speed*0.9,tc=RV.t+(460-o.y)/vy,half=34/vy,need=o.len/2+16+LANE.margin;
  laneExtend(tc+half+0.5);
  for(let k=-2;k<=2;k++){const t=tc+half*k/2;if(Math.abs(o.x+o.dir*o.spd*(t-RV.t)-laneX(t))<need)return false;}
  return true;
}
function hitWagon(dmg){
  RV.invuln=1.1;RV.hitFlash=0.5;SFX.rock();
  G.wagonHP-=dmg;
  const loose=G.crates.map((c,i)=>({c,i})).filter(o=>!o.c.lashed);
  if(loose.length&&G.wagonHP>0){ // v25: the hit that sinks the raft spills nothing, so that crate is counted on the GLUB screen with the rest
    const pick=loose[ri(0,loose.length-1)];
    RV.spillMsg='LOST A CRATE OF '+GOODS[pick.c.good].name+'!';RV.spillT=1.6;SFX.splash();
    if(RV.mode==='still')RV.feed.push({msg:RV.spillMsg,t:0,y:null}); // v30 (15): STILL VIEW lists it in the corner the river ends on
    G.crates.splice(pick.i,1);
  }
  if(G.wagonHP<=0){
    G.wagonHP=0;
    G.causeOfDeath='Your raft broke apart in the '+riverTitle(RV.cfg.name)+'.'; // v24: title case (user)
    setState('gameover');
  }
}
function updScroll(dt){ // v28: SCROLL VIEW
  const r=RV.cfg;
  RV.t+=dt;
  const prog=clamp(RV.t/r.length,0,1);
  const steer=340*(1-steerPenalty())*(RV.allLashed?1.1:1);
  let ax=0;
  if(['arrowleft','arrowright','a','d'].some(k=>keys[k]))RV.hint=false; // v28: the steering hint leaves at the first steering key (26a)
  if(keys['arrowleft']||keys['a'])ax-=steer;
  if(keys['arrowright']||keys['d'])ax+=steer;
  RV.currents.forEach(cu=>{if(Math.abs(cu.y-460)<80)ax+=cu.dir*r.current*150;});
  RV.vx+=ax*dt;RV.vx*=Math.pow(0.001,dt);RV.x+=RV.vx*dt;
  if(RV.pre){RV.x=W/2;RV.vx=0;} // v27: the head start holds the raft at center
  if(RV.x<RV.bankL+18){RV.x=RV.bankL+18;if(RV.vx<-120)hitWagon(6);RV.vx=0;}
  if(RV.x>RV.bankR-18){RV.x=RV.bankR-18;if(RV.vx>120)hitWagon(6);RV.vx=0;}
  if(state!=='river')return; // died on bank hit

  RV.rockT-=dt;
  if(RV.rockT<=0&&prog<0.94){let ok=false; // river v1: a refused spawn waits a moment and tries again, so the lane never thins the river
    for(let k=0;k<LANE.tries&&!ok;k++){const o={x:rnd(RV.bankL+30,RV.bankR-30),y:-40,s:rnd(16,34)};if(rockClear(o)){RV.rocks.push(o);ok=true;}}
    RV.rockT=ok?r.rockRate*rnd(0.7,1.3):LANE.retry;}
  if(r.logRate>0){RV.logT-=dt;
    if(RV.logT<=0&&prog<0.9){let ok=false;
      for(let k=0;k<LANE.tries&&!ok;k++){const dir=Math.random()<0.5?1:-1;
        const o={x:dir===1?RV.bankL-40:RV.bankR+40,y:rnd(-60,-20),dir,len:rnd(60,110),spd:rnd(LOG_SPD[0],LOG_SPD[1])};if(logClear(o)){RV.logs.push(o);ok=true;}}
      RV.logT=ok?r.logRate*rnd(0.7,1.4):LANE.retry;}}
  RV.curT-=dt;
  if(r.current>0&&RV.curT<=0&&prog<0.9){RV.curT=rnd(r.curMin,r.curMax); // river v1: per-river current timing
    RV.currents.push({y:-60,dir:Math.random()<0.5?1:-1});}

  const flow=RV.speed;
  RV.rocks.forEach(o=>o.y+=flow*dt);
  RV.logs.forEach(o=>{o.y+=flow*dt*0.9;o.x+=o.dir*o.spd*dt;});
  RV.currents.forEach(o=>o.y+=flow*dt);
  RV.rocks=RV.rocks.filter(o=>o.y<H+60);
  RV.logs=RV.logs.filter(o=>o.y<H+60&&!(o.dir===1?o.x-o.len/2>=RV.bankR:o.x+o.len/2<=RV.bankL)); // v28: gone once under the far bank (1a)
  RV.currents=RV.currents.filter(o=>o.y<H+120);
  laneExtend(RV.t+6);
  // market v7: soft white water on every river, decoration only (no collisions, no push). v8: shore driftwood removed, replaced by real logs
  RV.whiteT-=dt;
  if(RV.whiteT<=0&&prog<0.94){RV.whiteT=rnd(1.4,2.8);const w=rnd(40,90);RV.white.push({x:rnd(RV.bankL+w/2+10,RV.bankR-w/2-10),y:-30,w,seed:rnd(0,6)});}
  RV.white.forEach(o=>o.y+=flow*dt);
  RV.white=RV.white.filter(o=>o.y<H+40);

  if(RV.invuln>0)RV.invuln-=dt;
  else{
    for(const o of RV.rocks){
      if(Math.abs(o.x-RV.x)<o.s*0.7+18&&Math.abs(o.y-460)<o.s*0.7+22){hitWagon(16);break;}
    }
    if(state!=='river')return;
    if(RV.invuln<=0)for(const o of RV.logs){
      if(Math.abs(o.x-RV.x)<o.len/2+16&&Math.abs(o.y-460)<34){hitWagon(12);break;}
    }
    if(state!=='river')return;
  }
  if(RV.hitFlash>0)RV.hitFlash-=dt;
  if(RV.spillT>0)RV.spillT-=dt;
  if(RV.pre)return; // v27: the head start draws nothing
  drawRiver();
  if(prog>=1&&!RV.done){ // river v2: freeze on the finish line before the town
    RV.done=true;RV.hitFlash=0;RV.invuln=0;RV.spillT=0;
    drawRiver();setState('arrival');
  }
}

    cx.fillStyle=C.woodD;cx.fillRect(-o.len/2+10,-3,o.len-20,3);
    cx.restore();
  });
  cx.restore();
  // raft
  const flash=RV.invuln>0&&Math.floor(RV.t*12)%2===0;

const CUR_DASH={col:'rgba(191,230,255,0.75)',rows:5,gap:14,stagger:90,speed:120,path:340,len:44,amp:3.2,ang:[10,24,16,30,20]}; // river v6: old arrow layout and speed, angles in degrees
function curDash(cu,i,t){ // where dash i of a current band sits: starts near the upstream bank, crosses at 120 and drifts downstream along its own angle, fading in and out
  const a=CUR_DASH.ang[i]*Math.PI/180,q=((i*CUR_DASH.stagger+t*CUR_DASH.speed)%CUR_DASH.path+CUR_DASH.path)%CUR_DASH.path;
  return {x:(cu.dir===1?RV.bankL+40:RV.bankR-40)+cu.dir*q,y:cu.y+i*CUR_DASH.gap+q*Math.tan(a),rot:cu.dir*a,alpha:Math.min(1,Math.sin(Math.PI*q/CUR_DASH.path)*1.6),q};

function retryCrates(cp,all){ // v24/v25: the departure crates TRY AGAIN brings back: those lashed when the raft sank, insured or not; all = the St. Louis leg
  const d=savedRun&&savedRun.dead;
  if(all||!d||!Array.isArray(d.lashed))return cp.crates.slice(); // a death record from before v24: everything, as then
  const keep=new Set(d.lashed);
  return cp.crates.filter(c=>keep.has(c.id));
}
function deathTally(cp,can,leg0){ // v25: every crate aboard at the sinking is either safe (it comes back) or lost
  const d=savedRun&&savedRun.dead,aboard=d&&d.crates!=null?d.crates:G.crates.length;
  if(!can)return{safe:0,lost:aboard,loose:false,game:false,all:aboard>0};
  if(!d||!Array.isArray(d.ids)){const k=retryCrates(cp,leg0).length;return{safe:Math.min(k,aboard),lost:Math.max(0,aboard-k),loose:aboard>k&&!leg0,game:false,all:false};} // older record
  const home=new Set(cp.crates.map(c=>c.id)),tied=new Set(d.lashed||[]);
  let safe=0,loose=0,game=0;
  d.ids.forEach(id=>{if(!home.has(id))game++;else if(leg0||tied.has(id))safe++;else loose++;}); // a crate not in the checkpoint joined on the trip: FRESH GAME
  return{safe,lost:loose+game,loose:loose>0,game:game>0,all:false};
}
function lossLine(T){ // v25: one sentence under the cause line (user picked 21d); a clause shows only when it applies

function opFrosted(x,y,w,h,a){ // blurred copy of the scene behind a dark tint. Browsers without canvas blur still get the tint

  cx.save();opRoundRect(x,y,w,h,14);cx.clip();cx.globalAlpha=a;

      const ox=OPOFF.getContext('2d');ox.setTransform(1,0,0,1,0,0);ox.clearRect(0,0,OPOFF.width,OPOFF.height);ox.drawImage(cv,0,0);

  cx.fillStyle='rgba(27,20,48,0.6)';cx.fillRect(x,y,w,h);cx.restore();
  cx.save();cx.globalAlpha=a*0.5;cx.strokeStyle='rgba(244,227,184,0.6)';cx.lineWidth=1.5;opRoundRect(x+0.75,y+0.75,w-1.5,h-1.5,14);cx.stroke();cx.restore();}

// ---------- river_v12: flow streaks, bank decorations, steering hint ----------
const FLOW={n:46,speed:40,len:30}; // the GLUB screen's streaks: 30 by 3 at 40 px/s
function mkStreaks(c){const out=[];for(let i=0;i<FLOW.n;i++)out.push({s:rnd(0,c.L),d:rnd(-(c.w/2-10),c.w/2-10)});return out;}
const STEER_KEYS=['arrowleft','arrowright','arrowup','arrowdown','a','d','w','s'];
const HINT={w:232,h:40,y:48}; // centered on the top bank (user approved steer_hint_mockup.png)
const DECO={ // per bank color: [type, count, room]. river_v14: bison room 46, was 58, so three still fit beside the wider channel. Rabbits amble at half the opening screen's 22 px/s with its hop; bison plod at its 6 px/s
  green:[['bunny',6,30],['flower',16,16]],brown:[['bison',3,46],['brock',9,26]],speed:{bunny:11,bison:6},
  flowerCols:['#f4e3b8','#c78fd6','#ffc247','#e05a4a']};
function decoFree(c,x,y,r,deco,self){ // clear of the water and sand, the screen edges, the HUD, the name plate, the hint plate and the other decorations
  if(y<48+r*0.6||y>H-r*0.6||x<r||x>W-r)return false; // river_v14: the whole animal stays on screen
  if(x<140+r&&y<84+r*0.6)return false; // river_v14: the whole animal stays clear of the name plateif(Math.abs(x-W/2)<HINT.w/2+14&&y<HINT.y+HINT.h+8)return false;
  if(Math.abs(near(c,x,y).d)<c.w/2+CG.sand+r*0.6)return false;
  for(let k=0;k<12;k++){const a=k/12*Math.PI*2,q=near(c,x+Math.cos(a)*r,y+Math.sin(a)*r*0.6);if(Math.abs(q.d)<c.w/2+CG.sand+4)return false;}
  return deco.every(o=>o===self||Math.hypot(o.x-x,o.y-y)>o.r+r);}
function mkDeco(c){ // river_v13: rolled with each layout
  const R=Math.random;
  const out=[];(c.bank===C.meadow?DECO.green:DECO.brown).forEach(([type,n,r])=>{let k=0,t=0;
    while(k<n&&t<12000){t++;const x=R()*W,y=48+R()*(H-48);
      if(decoFree(c,x,y,r,out,null)){const sp=DECO.speed[type]||0;out.push({type,x,y,r,f:R()<0.5?-1:1,col:DECO.flowerCols[Math.floor(R()*4)],v:R(),vx:sp?(R()<0.5?-1:1)*sp:0,pause:R()*2,ph:R()*6});k++;}}});
  return out;}
function updDeco(dt){const c=RV.crs;RV.deco.forEach(o=>{if(!o.vx)return;
  if(o.pause>0){o.pause-=dt;return;}
  if(Math.random()<dt*0.35){o.pause=1+Math.random()*(o.type==='bunny'?1.5:3);return;} // stops to graze now and then, as on the opening screen
  const nx=o.x+o.vx*dt;if(decoFree(c,nx,o.y,o.r,RV.deco,o))o.x=nx;else{o.vx=-o.vx;o.pause=0.4+Math.random();}});}
function drawDeco(o){
  if(o.type==='flower'){const x=o.x,y=o.y;cx.fillStyle='#4a7a32';cx.fillRect(x-1,y,2,7);cx.fillStyle=o.col;cx.fillRect(x-4,y-3,3,3);cx.fillRect(x+1,y-3,3,3);cx.fillRect(x-1.5,y-6,3,3);cx.fillRect(x-1.5,y,3,2);cx.fillStyle='#ffc247';cx.fillRect(x-1,y-2,2,2);return;}
  if(o.type==='brock'){const s=8+o.v*8,x=o.x,y=o.y;cx.fillStyle='#5e4a30';cx.beginPath();cx.moveTo(x-s,y+s*0.5);cx.lineTo(x-s*0.5,y-s*0.7);cx.lineTo(x+s*0.6,y-s*0.5);cx.lineTo(x+s,y+s*0.5);cx.closePath();cx.fill();
    cx.fillStyle='#a38a63';cx.beginPath();cx.moveTo(x-s*0.55,y-s*0.1);cx.lineTo(x-s*0.35,y-s*0.6);cx.lineTo(x+s*0.25,y-s*0.45);cx.lineTo(x+s*0.1,y-s*0.05);cx.closePath();cx.fill();return;}
  const bunny=o.type==='bunny',hop=bunny&&o.pause<=0?-Math.abs(Math.sin(RV.t*9+o.ph))*4:0,sc=bunny?1:0.55,dir=o.vx<0?-1:o.vx>0?1:o.f;
  cx.save();cx.translate(o.x,o.y+hop);cx.scale(dir*sc,sc);
  if(bunny){cx.fillStyle=C.tan;cx.fillRect(-13,-6,22,12);cx.fillRect(5,-14,6,10);cx.fillRect(9,-20,3,8);cx.fillStyle='#fff';cx.fillRect(-13,-2,5,5);} // the hunt's rabbit
  else{cx.fillStyle=C.buff;cx.fillRect(-43,-20,74,38);cx.fillRect(-8,-34,36,16);cx.fillRect(26,-22,18,28);cx.fillRect(-38,18,7,16);cx.fillRect(-20,18,7,16);cx.fillRect(4,18,7,16);cx.fillRect(18,18,7,16);
    cx.fillStyle=C.bearD;cx.fillRect(-8,-34,36,10);cx.fillRect(26,-22,18,14);cx.fillStyle='#e8dcc0';cx.fillRect(40,-24,4,4);} // the hunt's buffalo with a shoulder hump and four legs
  cx.restore();}
function keyCap(x,y,glyph){const s=15;
  cx.fillStyle='#c9b48a';cx.fillRect(x,y+1,s,s);cx.fillStyle=C.parch;cx.fillRect(x,y,s,s-1);cx.fillStyle=C.woodD;
  if(glyph.length===1){cx.font='bold 11px '+FONT2;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(glyph,x+s/2,y+s/2);return;}
  const m=x+s/2,n=y+s/2-0.5;cx.beginPath();
  if(glyph==='up'){cx.moveTo(m,n-3.5);cx.lineTo(m+4,n+2.5);cx.lineTo(m-4,n+2.5);}
  if(glyph==='down'){cx.moveTo(m,n+3.5);cx.lineTo(m+4,n-2.5);cx.lineTo(m-4,n-2.5);}
  if(glyph==='left'){cx.moveTo(m-3.5,n);cx.lineTo(m+2.5,n-4);cx.lineTo(m+2.5,n+4);}
  if(glyph==='right'){cx.moveTo(m+3.5,n);cx.lineTo(m-2.5,n-4);cx.lineTo(m-2.5,n+4);}
  cx.closePath();cx.fill();}
function keyCluster(x,y,g){const k=RV&&RV.mode==='still'&&RV.wait&&RV.throb&&!RV.popup?throbAt(RV.waitT):1; // v30 (4): throbs on the first river while the raft waits
  cx.save();cx.translate(x+25.5,y+16);cx.scale(k,k);cx.translate(-(x+25.5),-(y+16));
  keyCap(x+17,y,g[0]);keyCap(x,y+17,g[1]);keyCap(x+17,y+17,g[2]);keyCap(x+34,y+17,g[3]);cx.restore();}
function drawSteerHint(){const x=Math.round(W/2-HINT.w/2),y=HINT.y;
  cx.fillStyle='rgba(0,0,0,0.3)';cx.fillRect(x,y,HINT.w,HINT.h);
  txt('STEER',x+12,y+HINT.h/2-7,8,C.parch);
  keyCluster(x+78,y+3,['W','A','S','D']); // v30 (4): W A S D first, as on a keyboard (user)
  txt('OR',x+141,y+HINT.h/2-7,7,C.parchDim);
  keyCluster(x+170,y+3,['up','left','down','right']);}

// ---------- river_v13: layouts and current zones ----------
function zoneDash(z,i,half){ // dash i of zone z: where it sits along (s) and across (d), its angle and its fade
  const ang=ZONE.ang[i]*Math.PI/180,q=((i*z.wd/5+(RV.t+z.ph)*ZONE.speed)%z.wd+z.wd)%z.wd;
  return {s:z.s0+ZONE.top+i*ZONE.step+q*Math.tan(ang),d:z.side*half-z.side*(q+6),ang,alpha:Math.min(1,Math.sin(Math.PI*q/z.wd)*1.6)};}
function zoneSpan(z){const t0=Math.tan(Math.min(...ZONE.ang)*Math.PI/180),t1=Math.tan(Math.max(...ZONE.ang)*Math.PI/180);
  return {lo:z.s0+ZONE.top-12,hi:z.s0+ZONE.top+4*ZONE.step+z.wd*t1+12,t0,t1};}
function inZone(z,X,Y){ // the raft is pushed while its center is inside the band the dashes sweep
  const c=RV.crs,q=near(c,X,Y);if(q.run!==z.run)return false;
  const a=c.w/2-z.side*q.d-6;if(a<-6||a>z.wd+6)return false; // across, from the zone's bank
  const ds=q.s-(z.s0+ZONE.top),t0=Math.tan(Math.min(...ZONE.ang)*Math.PI/180),t1=Math.tan(Math.max(...ZONE.ang)*Math.PI/180);
  return ds>=a*t0-12&&ds<=4*ZONE.step+a*t1+12;}
function clearPath(c,rocks,margin){ // a raft-sized path from the start to the exit that keeps margin px past every rock and bank
  const S=4,nx=Math.ceil(W/S),ny=Math.ceil(H/S),ok=new Uint8Array(nx*ny),seen=new Uint8Array(nx*ny),lim=c.w/2-RAFT.rb;
  for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){const X=i*S+2,Y=j*S+2,q=near(c,X,Y);if(Math.abs(q.d)>lim-margin)continue;if(q.run===0&&q.fx<RAFT.rb)continue;
    let hit=false;for(const o of rocks){if(Math.hypot(o.x-X,o.y-Y)<o.s*0.7+RAFT.rr+margin){hit=true;break;}}if(!hit)ok[j*nx+i]=1;}
  const p0=cpt(c,c.runS(0,50),0),st=Math.round((p0.y-2)/S)*nx+Math.round((p0.x-2)/S);if(!ok[st])return false;const Q=[st];seen[st]=1;
  while(Q.length){const k=Q.pop(),i=k%nx,j=(k-i)/nx,q=near(c,i*S+2,j*S+2);if(q.run===1&&q.fx<=10)return true;
    for(const [a,b] of [[i+1,j],[i-1,j],[i,j+1],[i,j-1]]){if(a<0||b<0||a>=nx||b>=ny)continue;const m=b*nx+a;if(ok[m]&&!seen[m]){seen[m]=1;Q.push(m);}}}
  return false;}
function rollLayout(c){
  const d=COURSES[c.name],half=c.w/2,st=cpt(c,c.runS(0,50),0),wd=ZONE.wd*c.w,t1=Math.tan(Math.max(...ZONE.ang)*Math.PI/180);
  const ext=4*ZONE.step+wd*t1+12; // how far a zone reaches downstream of its start
  const runRange=run=>run===0?[c.runS(0,150)-ZONE.top+12,c.L1-ext-ZONE.top]:[c.L1+c.L2-ZONE.top+20,c.runS(1,20)-ext-ZONE.top];
  const rockOk=(rocks,lanes,p,sz,s)=>Math.hypot(p.x-st.x,p.y-st.y)>=LAYOUT.startClear&&!lanes.some(l=>Math.abs(l.s-s)<sz*0.7+LOGW+RAFT.rr+8)&&rocks.every(o=>Math.hypot(o.x-p.x,o.y-p.y)>=(o.s+sz)*0.7+LAYOUT.rockGap);
  for(let tries=0;tries<LAYOUT.tries;tries++){
    const zones=[],rocks=[],lanes=[];let g=0;
    while(zones.length<d.zones&&g<300){g++;const run=Math.random()<0.5?0:1,[a,b]=runRange(run);if(b<=a)continue;const s0=rnd(a,b),side=Math.random()<0.5?1:-1;
      if(zones.some(z=>z.run===run&&Math.abs(z.s0-s0)<LAYOUT.zoneGap))continue;
      const sz=rnd(LAYOUT.rockSize[0],LAYOUT.rockSize[1]),rs=s0+ZONE.rockGap,rd=-side*rnd(0.4,0.75)*(half-12),p=cpt(c,rs,rd); // its rock: just downstream, on the far half
      if(!rockOk(rocks,lanes,p,sz,rs))continue;
      zones.push({run,s0,side,wd,ph:rnd(0,10)});rocks.push({x:p.x,y:p.y,s:sz,cs:rs,d:rd,run,paired:true});}
    if(zones.length<d.zones)continue;
    g=0;while(lanes.length<d.lanes&&g<300){g++;const run=Math.random()<0.5?0:1,x=rnd(140,CG.xB-60),s=c.runS(run,x);
      if(lanes.some(l=>Math.abs(l.s-s)<LAYOUT.laneGap))continue;if(rocks.some(o=>Math.abs(o.cs-s)<o.s*0.7+LOGW+RAFT.rr+8))continue;
      lanes.push({s,run,fx:x,timer:0,busy:null});}
    if(lanes.length<d.lanes)continue;
    g=0;while(rocks.length<d.rocks&&g<3000){g++;const u=Math.random(),run=u<0.42?0:u<0.84?1:2,x=run===2?rnd(-75,75):rnd(run===0?150:40,CG.xB),dd=rnd(-(half-14),half-14),
      sz=rnd(LAYOUT.rockSize[0],LAYOUT.rockSize[1]),s=c.runS(run,x),p=cpt(c,s,dd);if(rockOk(rocks,lanes,p,sz,s))rocks.push({x:p.x,y:p.y,s:sz,cs:s,d:dd,run});}
    if(rocks.length<d.rocks)continue;
    if(!clearPath(c,rocks,LAYOUT.margin))continue;
    c.rolls=tries+1;return {rocks,lanes,zones};}
  throw new Error('no clear layout for '+c.name);}


// ---------- v28: the one-time river mode popup (user approved river_mode_popup_mockup_v2.png) ----------
function miniScroll(x,y,w,h){ // a small picture of SCROLL VIEW: a straight river running down the screen
  cx.save();cx.beginPath();cx.rect(x,y,w,h);cx.clip();

  cx.fillStyle=C.meadow;cx.fillRect(x,y,w,h);cx.fillStyle='#d9b98a';cx.fillRect(bl-3,y,3,h);cx.fillRect(br,y,3,h);
  cx.fillStyle=C.riverD;cx.fillRect(bl,y,br-bl,h);
  cx.strokeStyle=C.river;cx.lineWidth=2;[[0.2,0.15],[0.7,0.3],[0.4,0.55],[0.8,0.75],[0.25,0.9]].forEach(([a,b])=>{const sx=bl+(br-bl)*a,sy=y+h*b;cx.beginPath();cx.moveTo(sx,sy-6);cx.lineTo(sx,sy+6);cx.stroke();});
  const rock=(rx,ry,s)=>{cx.fillStyle=C.rockD;cx.beginPath();cx.moveTo(rx-s,ry+s*0.6);cx.lineTo(rx-s*0.4,ry-s);cx.lineTo(rx+s*0.5,ry-s*0.7);cx.lineTo(rx+s,ry+s*0.6);cx.closePath();cx.fill();cx.fillStyle=C.foam;cx.fillRect(rx-s,ry+s*0.55,s*2,2);};
  rock(bl+22,y+34,8);rock(br-20,y+78,9);rock(bl+30,y+118,7);
  cx.fillStyle=C.trunk;cx.fillRect(br-52,y+46,34,7);cx.fillStyle=C.woodL;cx.fillRect(br-52,y+46,3,7);cx.fillRect(br-21,y+46,3,7);
  cx.strokeStyle=CHEV;cx.lineWidth=1.5;cx.beginPath();for(let q=-11;q<=11;q+=2){const X=bl+40+q,Y=y+96+Math.sin(q/3)*1.6+q*0.3;q===-11?cx.moveTo(X,Y):cx.lineTo(X,Y);}cx.stroke();
  const rx=x+w/2,ry=y+h-34;cx.fillStyle=C.woodD;cx.fillRect(rx-10,ry-13,20,26);cx.fillStyle=C.wood;for(let i=0;i<4;i++)cx.fillRect(rx-9+i*5,ry-12,4,24);
  cx.fillStyle=C.woodL;cx.fillRect(rx-7,ry-9,6,6);cx.fillRect(rx+1,ry-9,6,6);cx.fillRect(rx-7,ry+2,6,6);cx.fillRect(rx+1,ry+2,6,6);
  cx.restore();
  cx.strokeStyle=C.woodL;cx.lineWidth=2;cx.strokeRect(x,y,w,h);
  cx.fillStyle=C.parch;const ay=y+h/2;[x+13,x+w-13].forEach(ax=>{cx.fillRect(ax-1.5,ay-16,3,22);cx.beginPath();cx.moveTo(ax-6,ay+4);cx.lineTo(ax+6,ay+4);cx.lineTo(ax,ay+12);cx.closePath();cx.fill();}); // an arrow on each bank (user)
}
const MODEPOP={h:236,pic:128,gap:28,title:'RIVER MODE: STILL VIEW',lines:['You can change the river mode','to SCROLL VIEW in SETTINGS','on the title screen.'],cap:'SCROLL VIEW PREVIEW'}; // v29 (3, 13a): the user's wording
